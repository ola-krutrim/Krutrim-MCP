name: Publish stdio package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: krutrim-mcp-server

jobs:
  build:
    name: Test, build, and validate distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked test and release dependencies
        run: uv sync --locked --extra dev --extra release --python 3.12
      - name: Require a default-branch tag matching the package version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
              echo "Release tag must point to a commit on $DEFAULT_BRANCH" >&2
              exit 1
            }
            version="$(uv run --no-sync python scripts/release_check.py check --tag "$GITHUB_REF_NAME")"
          else
            version="$(uv run --no-sync python scripts/release_check.py check)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run release tests
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync pytest -q
          uv pip check
      - name: Audit the hash-locked runtime
        run: |
          uv export --quiet --locked --no-dev --no-emit-project \
            --output-file /tmp/krutrim-mcp-runtime-requirements.txt
          uv run --no-sync pip-audit --strict --require-hashes \
            --progress-spinner off \
            --requirement /tmp/krutrim-mcp-runtime-requirements.txt
      - name: Build wheel and source distribution once
        run: uv run --no-sync python -m build --no-isolation
      - name: Validate metadata and package contents
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv run --no-sync twine check --strict dist/*
          uv run --no-sync check-wheel-contents dist/*.whl
          uv run --no-sync python scripts/verify_release_artifacts.py local \
            --dist dist \
            --version "$RELEASE_VERSION"
      - name: Generate release CycloneDX SBOM
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/krutrim-mcp-release-runtime \
            uv sync --locked --no-dev --python 3.12
          mkdir -p sbom
          uv run --no-sync cyclonedx-py environment \
            /tmp/krutrim-mcp-release-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file \
              "sbom/krutrim-mcp-server-${RELEASE_VERSION}.cdx.json"
      - name: Smoke-test the built wheel
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv venv /tmp/krutrim-mcp-release-smoke --python 3.12
          uv pip install --require-hashes \
            --python /tmp/krutrim-mcp-release-smoke/bin/python \
            --requirement /tmp/krutrim-mcp-runtime-requirements.txt
          uv pip install --no-deps \
            --python /tmp/krutrim-mcp-release-smoke/bin/python \
            dist/*.whl
          uv pip check --python /tmp/krutrim-mcp-release-smoke/bin/python
          test "$(/tmp/krutrim-mcp-release-smoke/bin/krutrim-mcp-server --version)" = \
            "$RELEASE_VERSION"
          /tmp/krutrim-mcp-release-smoke/bin/krutrim-mcp-server --list-tools \
            >/tmp/krutrim-mcp-tools.txt
          test -s /tmp/krutrim-mcp-tools.txt
      - name: Store immutable distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Store release SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    name: Publish the validated files to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/krutrim-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish the validated files to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/krutrim-mcp-server
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-pypi:
    name: Verify PyPI artifact digests
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Compare PyPI files with the original build
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python scripts/verify_release_artifacts.py index \
            --dist dist \
            --repository https://pypi.org \
            --project "$PACKAGE_NAME" \
            --version "$RELEASE_VERSION"

  github-release:
    name: Create the GitHub Release
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
          path: assets/
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python scripts/release_check.py notes --version "$RELEASE_VERSION" > notes.md
          flags=""
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then flags="--prerelease"; fi
          gh release create "$RELEASE_TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$PACKAGE_NAME $RELEASE_VERSION" \
            --notes-file notes.md \
            $flags
